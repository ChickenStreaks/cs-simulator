<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ChickenStreaks Simulator</title>
<meta name="description" content="ChickenStreaks with a test family: use the app, or see every screen.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/simulator/screens/tokens.css">
<link rel="stylesheet" href="/simulator/shell/shell.css">
<link rel="stylesheet" href="/simulator/shell/pages.css">
<!-- the doors read the one WB state: is there a family in use, signed in? -->
<script src="/simulator/sim.js"></script>
</head>
<body class="sh-page">
<header class="sh-bar" role="region" aria-label="Simulator">
  <a class="sh-brand" href="/simulator/"><img class="sh-hen" src="/simulator/screens/img/gallina.png" alt=""><span class="sh-brand-t"><b>ChickenStreaks</b> Simulator</span></a>
</header>

<main class="doors">
  <h1>Try the app, or see every screen</h1>
  <div class="doors-row">
    <section class="door" data-testid="door-app" aria-labelledby="door-app-t">
      <h2 id="door-app-t">Use the app</h2>
      <p>A phone with the test family. It remembers what you do until Reset.</p>
      <div class="door-acts">
        <a class="door-btn" href="app.html" data-testid="door-continue" hidden>Continue</a>
        <a class="door-btn" href="app.html?from=splash" data-testid="door-start">Start</a>
      </div>
    </section>
    <section class="door" data-testid="door-screens-card" aria-labelledby="door-screens-t">
      <h2 id="door-screens-t">See the screens</h2>
      <p>Every screen and state, grouped by flow.</p>
      <div class="door-acts">
        <a class="door-btn primary" href="gallery.html" data-testid="door-screens">Open</a>
      </div>
    </section>
  </div>
</main>

<script src="/simulator/shell/doors.js"></script>
</body>
</html>
