<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<script src="/simulator/sim.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hoy · ChickenStreaks</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/simulator/screens/tokens.css">
<link rel="stylesheet" href="_app.css">
</head>
<body>
<main class="app" data-od-id="kid">
  <header class="top">
    <button type="button" class="back" data-od-id="kid-back" aria-label="Regresar" hidden>←</button>
    <div style="flex:1"><h1 data-od-id="kid-hello"></h1><small data-od-id="kid-sub"></small></div>
    <span class="pill" data-od-id="kid-eggs"><i class="egg"></i><b></b></span>
  </header>
  <section class="card hero" data-od-id="kid-hero">
    <div class="hen" data-od-id="kid-hen" data-img="../img/gallina.png"></div>
    <div data-od-id="kid-streak"></div>
  </section>
  <section class="card" data-od-id="kid-forgive" hidden></section>
  <p class="section" data-od-id="kid-for-adult" hidden>Sin teléfono: márcalas tú</p>
  <div data-od-id="kid-chores" style="display:flex;flex-direction:column;gap:8px"></div>
  <button type="button" class="btn soft wide" data-od-id="kid-prizes" hidden>Ver sus premios</button>
</main>
<div class="toast" data-od-id="kid-toast" role="status" hidden></div>
<nav class="tabs" data-od-id="tabs" aria-label="Secciones">
  <button type="button" data-od-id="tab-kid" data-go="app.kid"><span aria-hidden="true">🐔</span>Hoy</button>
  <button type="button" data-od-id="tab-prizes" data-go="app.prizes"><span aria-hidden="true">🎁</span>Premios</button>
</nav>
</body>
</html>
